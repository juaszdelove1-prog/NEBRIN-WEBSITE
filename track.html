<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track Application | NEBRIN</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="site-header"><div class="container nav-wrap">
<a class="brand" href="index.html"><span class="brand-mark"><span class="brand-orbit"></span><span class="brand-globe">N</span></span>
<span class="brand-copy"><strong>NEBRIN</strong><small>ONLINE SERVICE COMPANY LIMITED</small></span></a>

      <div class="language-control">
        <label for="languageSelector">Language</label>
        <select id="languageSelector" aria-label="Choose language">
          <option value="en">English</option>
          <option value="sw">Kiswahili</option>
          <option value="fr">Français</option>
          <option value="pt">Português</option>
          <option value="ar">العربية</option>
        </select>
      </div>

<a class="btn btn-primary" href="index.html#apply">Apply for a Service</a></div></header>
<main class="track-shell"><div class="container"><section class="track-card">
<p class="section-label">APPLICATION TRACKING</p><h1>Check your application status</h1>
<p>Enter your reference number and the same phone number used during submission.</p>
<div class="track-form"><input id="trackReference" placeholder="Reference e.g. NEB-20260802-ABC123">
<input id="trackPhone" placeholder="Phone number"><button id="trackBtn" class="btn btn-primary full">Check Status</button></div>
<div id="trackStatus" class="form-status full" aria-live="polite"></div><div id="trackResult" class="track-result"></div>
</section></div></main>
