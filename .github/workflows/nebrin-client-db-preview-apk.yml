name: NEBRIN Client Database Preview APK

on:
  push:
    branches: [nebrin-client-database-app]
    paths:
      - 'nebrin-client-db-app/**'
      - '.github/workflows/nebrin-client-db-preview-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nebrin-client-db-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Synchronize dependency lockfile
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Expo Doctor
        run: npx expo-doctor
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEBRIN-Client-Database-preview-apk
          path: nebrin-client-db-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
