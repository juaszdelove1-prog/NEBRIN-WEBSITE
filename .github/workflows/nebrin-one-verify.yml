name: NEBRIN ONE Verify

on:
  push:
    branches:
      - nebrin-one-security-module
      - nebrin-one-release
    paths:
      - 'nebrin-one-app/**'
      - '.github/workflows/nebrin-one-verify.yml'
  pull_request:
    paths:
      - 'nebrin-one-app/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nebrin-one-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript strict check
        run: npm run typecheck
      - name: Expo Doctor
        run: npx expo-doctor@latest
